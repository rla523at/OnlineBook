<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">보조 패널 예시</title>
  <desc id="desc">현재 작업 모달 옆에 상세 정보와 이력이 붙어 있는 보조 패널 예시</desc>
  <rect width="1100" height="620" fill="#f8fafc"/>
  <text x="550" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#111827">보조 패널</text>
  <text x="550" y="94" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#475569">현재 작업을 유지한 채 옆에서 상세 정보와 이력을 확인하는 패턴</text>

  <g transform="translate(90 132)">
    <rect x="0" y="0" width="560" height="390" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="36" y="52" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#111827">인원 수정</text>
    <rect x="36" y="92" width="210" height="58" rx="12" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="58" y="127" font-family="Arial, sans-serif" font-size="18" fill="#334155">이름 입력</text>
    <rect x="278" y="92" width="210" height="58" rx="12" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="300" y="127" font-family="Arial, sans-serif" font-size="18" fill="#334155">핸드폰 번호</text>

    <rect x="36" y="178" width="452" height="150" rx="14" fill="#ecfeff" stroke="#06b6d4" stroke-width="3"/>
    <text x="62" y="220" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0e7490">급여형태 적용 시작일</text>
    <rect x="62" y="246" width="190" height="52" rx="10" fill="#ffffff" stroke="#67e8f9"/>
    <text x="84" y="279" font-family="Arial, sans-serif" font-size="18" fill="#0e7490">2026-06-30</text>
    <rect x="278" y="246" width="100" height="52" rx="26" fill="#cffafe" stroke="#22d3ee"/>
    <text x="328" y="279" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0e7490">이력 보기</text>
  </g>

  <g transform="translate(690 132)">
    <rect x="0" y="0" width="320" height="390" rx="18" fill="#ffffff" stroke="#16a34a" stroke-width="4"/>
    <text x="28" y="52" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#14532d">인원 상세</text>
    <rect x="28" y="84" width="264" height="54" rx="10" fill="#f0fdf4" stroke="#86efac"/>
    <text x="50" y="118" font-family="Arial, sans-serif" font-size="17" fill="#166534">현재 급여형태: 일급</text>
    <text x="28" y="174" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#14532d">급여형태 이력</text>
    <rect x="28" y="198" width="264" height="44" rx="8" fill="#f8fafc" stroke="#bbf7d0"/>
    <text x="50" y="226" font-family="Arial, sans-serif" font-size="15" fill="#166534">2026-06-30 · 일급</text>
    <rect x="28" y="252" width="264" height="44" rx="8" fill="#f8fafc" stroke="#bbf7d0"/>
    <text x="50" y="280" font-family="Arial, sans-serif" font-size="15" fill="#166534">2026-05-01 · 주급</text>
    <rect x="28" y="306" width="264" height="44" rx="8" fill="#f8fafc" stroke="#bbf7d0"/>
    <text x="50" y="334" font-family="Arial, sans-serif" font-size="15" fill="#166534">2026-04-01 · 일급</text>
  </g>

  <path d="M650 326 C672 326 668 326 690 326" fill="none" stroke="#16a34a" stroke-width="4" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <g transform="translate(202 555)">
    <rect x="0" y="0" width="696" height="42" rx="21" fill="#dcfce7"/>
    <text x="348" y="27" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#166534">핵심: 원래 작업은 유지하고, 옆에서 판단에 필요한 맥락 정보를 보여 준다.</text>
  </g>
</svg>
