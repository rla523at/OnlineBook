<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">Card 예시</title>
  <desc id="desc">같은 형식의 개별 항목이 여러 개 반복되는 Card 예시</desc>
  <rect width="1100" height="620" fill="#f8fafc"/>
  <text x="550" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#111827">Card</text>
  <text x="550" y="94" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#475569">반복 가능한 개별 항목이나 작은 정보 묶음</text>

  <g transform="translate(136 138)">
    <rect x="0" y="0" width="828" height="360" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="34" y="48" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#111827">지사 목록</text>

    <g transform="translate(34 82)">
      <rect x="0" y="0" width="232" height="224" rx="14" fill="#fff7ed" stroke="#fb923c" stroke-width="3"/>
      <circle cx="44" cy="44" r="22" fill="#fed7aa"/>
      <text x="80" y="40" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#9a3412">강남지사</text>
      <text x="80" y="66" font-family="Arial, sans-serif" font-size="15" fill="#9a3412">개별 항목 1</text>
      <rect x="24" y="104" width="184" height="18" rx="9" fill="#fdba74"/>
      <rect x="24" y="138" width="136" height="18" rx="9" fill="#fed7aa"/>
      <rect x="24" y="178" width="86" height="28" rx="8" fill="#f97316"/>
      <text x="67" y="197" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff">보기</text>
    </g>

    <g transform="translate(298 82)">
      <rect x="0" y="0" width="232" height="224" rx="14" fill="#eff6ff" stroke="#60a5fa" stroke-width="3"/>
      <circle cx="44" cy="44" r="22" fill="#bfdbfe"/>
      <text x="80" y="40" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1d4ed8">송파지사</text>
      <text x="80" y="66" font-family="Arial, sans-serif" font-size="15" fill="#1d4ed8">개별 항목 2</text>
      <rect x="24" y="104" width="184" height="18" rx="9" fill="#93c5fd"/>
      <rect x="24" y="138" width="136" height="18" rx="9" fill="#bfdbfe"/>
      <rect x="24" y="178" width="86" height="28" rx="8" fill="#2563eb"/>
      <text x="67" y="197" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff">보기</text>
    </g>

    <g transform="translate(562 82)">
      <rect x="0" y="0" width="232" height="224" rx="14" fill="#f5f3ff" stroke="#a78bfa" stroke-width="3"/>
      <circle cx="44" cy="44" r="22" fill="#ddd6fe"/>
      <text x="80" y="40" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#6d28d9">마포지사</text>
      <text x="80" y="66" font-family="Arial, sans-serif" font-size="15" fill="#6d28d9">개별 항목 3</text>
      <rect x="24" y="104" width="184" height="18" rx="9" fill="#c4b5fd"/>
      <rect x="24" y="138" width="136" height="18" rx="9" fill="#ddd6fe"/>
      <rect x="24" y="178" width="86" height="28" rx="8" fill="#7c3aed"/>
      <text x="67" y="197" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff">보기</text>
    </g>
  </g>

  <g transform="translate(242 535)">
    <rect x="0" y="0" width="616" height="46" rx="23" fill="#ffedd5"/>
    <text x="308" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#9a3412">핵심: Card는 보통 같은 형식으로 여러 개 반복된다.</text>
  </g>
</svg>

