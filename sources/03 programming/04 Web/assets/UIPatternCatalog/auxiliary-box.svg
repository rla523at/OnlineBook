<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">독립 보조 박스 예시</title>
  <desc id="desc">본문 흐름을 보조하는 참고, 주의, 팁 같은 독립 보조 박스 예시</desc>
  <rect width="1100" height="620" fill="#f8fafc"/>
  <text x="550" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#111827">독립 보조 박스</text>
  <text x="550" y="94" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#475569">본문을 보조하는 정보를 별도 박스로 떼어 보여 주는 패턴</text>

  <g transform="translate(132 132)">
    <rect x="0" y="0" width="836" height="386" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="42" y="52" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#111827">정산내역 조회 방법</text>
    <rect x="42" y="88" width="492" height="18" rx="9" fill="#cbd5e1"/>
    <rect x="42" y="122" width="462" height="18" rx="9" fill="#e2e8f0"/>
    <rect x="42" y="156" width="512" height="18" rx="9" fill="#e2e8f0"/>

    <rect x="586" y="88" width="208" height="198" rx="14" fill="#ecfeff" stroke="#06b6d4" stroke-width="3"/>
    <text x="614" y="130" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0e7490">참고</text>
    <rect x="614" y="154" width="150" height="14" rx="7" fill="#67e8f9"/>
    <rect x="614" y="184" width="138" height="14" rx="7" fill="#a5f3fc"/>
    <rect x="614" y="214" width="164" height="14" rx="7" fill="#a5f3fc"/>
    <text x="690" y="262" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#0e7490">보조 정보</text>

    <rect x="42" y="220" width="492" height="18" rx="9" fill="#cbd5e1"/>
    <rect x="42" y="254" width="430" height="18" rx="9" fill="#e2e8f0"/>
    <rect x="42" y="288" width="472" height="18" rx="9" fill="#e2e8f0"/>
    <rect x="42" y="322" width="384" height="18" rx="9" fill="#e2e8f0"/>
  </g>

  <g transform="translate(196 545)">
    <rect x="0" y="0" width="708" height="46" rx="23" fill="#cffafe"/>
    <text x="354" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0e7490">핵심: 주요 흐름은 아니지만 독립적으로 떼어 볼 수 있는 보조 정보다.</text>
  </g>
</svg>

