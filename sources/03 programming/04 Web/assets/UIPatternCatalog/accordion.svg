<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">Accordion UI 예시</title>
  <desc id="desc">제목을 누르면 항목의 본문이 펼쳐지고 접히는 Accordion UI 예시</desc>
  <rect width="1100" height="620" fill="#f8fafc"/>
  <text x="550" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#111827">Accordion UI</text>
  <text x="550" y="94" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#475569">제목을 눌러 필요한 내용만 펼쳐 보는 패턴</text>

  <g transform="translate(170 140)">
    <rect x="0" y="0" width="760" height="360" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

    <rect x="34" y="34" width="692" height="64" rx="10" fill="#eef2ff" stroke="#818cf8"/>
    <text x="64" y="75" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1e1b4b">정산내역은 언제 갱신되나요?</text>
    <text x="690" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#4338ca">⌃</text>

    <rect x="54" y="108" width="652" height="88" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="80" y="144" font-family="Arial, sans-serif" font-size="18" fill="#334155">정산 계산이 완료되면 선택한 기간과 지사 조건에 맞춰 표시됩니다.</text>
    <text x="80" y="174" font-family="Arial, sans-serif" font-size="18" fill="#334155">이 영역은 펼쳐진 accordion panel입니다.</text>

    <rect x="34" y="218" width="692" height="64" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="64" y="259" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#111827">다운로드 버튼은 언제 활성화되나요?</text>
    <text x="690" y="259" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#64748b">⌄</text>

    <rect x="34" y="292" width="692" height="64" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="64" y="333" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#111827">조회 조건은 어디에서 바꾸나요?</text>
    <text x="690" y="333" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#64748b">⌄</text>
  </g>

  <g transform="translate(210 535)">
    <rect x="0" y="0" width="680" height="46" rx="23" fill="#e0f2fe"/>
    <text x="340" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#075985">핵심: 제목 영역은 trigger, 펼쳐진 본문은 panel이다.</text>
  </g>
</svg>

